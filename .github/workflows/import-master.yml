name: Ship live Aug Sep jobs
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download jobs data
        run: |
          set -euo pipefail
          mkdir -p data
          curl -fsSL -o data/jobs.json https://files.catbox.moe/fzrkos.json
          curl -fsSL -o data/jobs_part_1.json https://files.catbox.moe/gr7t89.json
          curl -fsSL -o data/jobs_part_2.json https://files.catbox.moe/80nymq.json
          curl -fsSL -o data/jobs_part_3.json https://files.catbox.moe/bpto8i.json
          curl -fsSL -o data/jobs_part_4.json https://files.catbox.moe/6taztb.json
          curl -fsSL -o data/jobs_part_5.json https://files.catbox.moe/djser3.json
          curl -fsSL -o data/jobs_part_6.json https://files.catbox.moe/ds5zjp.json
          python3 - << 'PY'
          import json
          jobs = json.load(open('data/jobs.json'))
          print('n', len(jobs))
          stori = [j for j in jobs if j['team_lead']=='Matthew' and 'stori' in j['client_name'].lower() and j['date'].startswith('2026-08-')]
          assert [j['date'] for j in stori] == ['2026-08-25'], stori
          matt = [j['client_name'] for j in jobs if j['date']=='2026-08-26' and j['team_lead']=='Matthew']
          assert set(matt) == {'Sarah Vanderlinden','Christopher Cheng','Ryan Zughbi','Dianna Underwood'}, matt
          assert len(matt) == 4, matt
          mel = [j for j in jobs if 'melissa otto' in j['client_name'].lower() and j['team_lead']=='Alun' and j['date']>='2026-08-03']
          assert [j['date'] for j in mel] == ['2026-08-28'], mel
          yu = [j for j in jobs if 'yu siu ping' in j['client_name'].lower() and j['date']=='2026-08-26']
          assert any('=> 03.30pm' in (j.get('time') or '') for j in yu), yu
          print('CHECKS PASSED')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - << 'PY'
          import json
          json.dump([
            'jobs_part_1.json','jobs_part_2.json','jobs_part_3.json',
            'jobs_part_4.json','jobs_part_5.json','jobs_part_6.json'
          ], open('data/manifest.json','w'))
          PY
          git add data/jobs.json data/jobs_part_*.json data/manifest.json
          git diff --cached --quiet && echo no-changes && exit 0
          git commit -m "Re-import live Aug/Sep jobs using date-header column ownership"
          git push
