name: Import Master 2026 schedule
on:
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Master files
        run: |
          set -euo pipefail
          mkdir -p data js
          curl -fsSL -o js/app.js https://files.catbox.moe/h7oid5.js
          curl -fsSL -o data/jobs.json https://files.catbox.moe/gujn0i.json
          curl -fsSL -o data/jobs_part_1.json https://files.catbox.moe/g7pzb5.json
          curl -fsSL -o data/jobs_part_2.json https://files.catbox.moe/0835i8.json
          curl -fsSL -o data/jobs_part_3.json https://files.catbox.moe/9tcidn.json
          curl -fsSL -o data/jobs_part_4.json https://files.catbox.moe/zmu0xf.json
          curl -fsSL -o data/jobs_part_5.json https://files.catbox.moe/pc57vi.json
          curl -fsSL -o data/manifest.json https://files.catbox.moe/4mfkj5.json
          python3 - <<'PY'
          import json, pathlib
          app = pathlib.Path('js/app.js').read_text()
          assert 'function jobIsPaid' in app, 'app.js missing jobIsPaid'
          jobs = json.loads(pathlib.Path('data/jobs.json').read_text())
          assert len(jobs) == 2339, len(jobs)
          assert jobs[0].get('payment_status') in ('PAID', 'UNPAID')
          n = 0
          for i in range(1, 6):
              n += len(json.loads(pathlib.Path(f'data/jobs_part_{i}.json').read_text()))
          assert n == 2339, n
          print('verified', len(jobs), 'jobs')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js data/jobs.json data/jobs_part_1.json data/jobs_part_2.json data/jobs_part_3.json data/jobs_part_4.json data/jobs_part_5.json data/manifest.json
          git commit -m "Load Master 2026 schedule and drive PAID/UNPAID from payment_status"
          git push
