name: Ship chrome polish
on:
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download files
        run: |
          set -euo pipefail
          curl -fsSL -o index.html https://files.catbox.moe/auj4z4.html
          curl -fsSL -o css/app.css https://files.catbox.moe/n3taup.css
          curl -fsSL -o css/be-shell.css https://files.catbox.moe/58vr01.css
          curl -fsSL -o js/shell-ui.js https://files.catbox.moe/dec716.js
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text().replace(r'\\u0026', '&')
          Path('index.html').write_text(html)
          assert 'Live Schedule' in html
          assert '>Detailed</button>' in html
          assert 'userMenuBtn' in html
          css = Path('css/app.css').read_text()
          assert 'density-seg' in css and 'live-name' in css
          print('ok')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/app.css css/be-shell.css js/shell-ui.js
          git commit -m "Polish technician chrome: Live Schedule, clearer controls, one-row header"
          git push
