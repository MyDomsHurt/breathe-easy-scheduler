name: Ship Performance login-gate fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download files
        run: |
          set -euo pipefail
          curl -fsSL -o dashboard/controls-local.css https://files.catbox.moe/57c4c3.css
          curl -fsSL -o dashboard/index.html https://files.catbox.moe/msgd94.html
          grep -q 'display: none !important' dashboard/controls-local.css
          grep -q 'position: fixed' dashboard/controls-local.css
          grep -q 'auth-ready' dashboard/controls-local.css
          grep -q 'controls-local.css?v=74' dashboard/index.html
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dashboard/controls-local.css dashboard/index.html
          git diff --cached --quiet && echo no-changes && exit 0
          git commit -m "Keep Performance login gate out of signed-in layout"
          git push
