name: Sync live September jobs
on:
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download job files
        run: |
          set -euo pipefail
          mkdir -p data
          curl -fsSL -o data/jobs.json https://files.catbox.moe/y5jxoa.json
          curl -fsSL -o data/jobs_part_5.json https://files.catbox.moe/ye9ya8.json
          curl -fsSL -o data/jobs_part_6.json https://files.catbox.moe/b834t6.json
          curl -fsSL -o data/manifest.json https://files.catbox.moe/jfbtmh.json
          python3 - <<'PY'
          import json, pathlib
          jobs = json.loads(pathlib.Path('data/jobs.json').read_text())
          assert len(jobs) == 2627, len(jobs)
          assert jobs[-1]['date'] > '2026-08-29', jobs[-1]['date']
          assert sum(1 for j in jobs if j['date'] < '2026-08-31') == 2364
          print('ok', len(jobs), jobs[-1]['date'])
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/jobs_part_5.json data/jobs_part_6.json data/manifest.json
          git commit -m "Add live September weekly jobs onto existing schedule"
          git push
