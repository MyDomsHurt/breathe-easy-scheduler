name: Ship technician default
on:
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download files
        run: |
          set -euo pipefail
          curl -fsSL -o js/app.js https://files.catbox.moe/ahiley.js
          curl -fsSL -o index.html https://files.catbox.moe/8buapa.html
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text().replace(r'\\u0026', '&')
          Path('index.html').write_text(html)
          js = Path('js/app.js').read_text()
          assert 'EMAIL_TO_TEAM' in js
          assert "range: 'today'" in js
          assert 'app.js?v=2' in html
          print('ok')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js index.html
          git commit -m "Default schedule to signed-in technician and Today"
          git push
