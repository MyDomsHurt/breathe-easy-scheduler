name: Ship control bar redesign
on:
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download files
        run: |
          set -euo pipefail
          curl -fsSL -o css/app.css https://files.catbox.moe/xbva0d.css
          curl -fsSL -o js/app.js https://files.catbox.moe/8bgb1w.js
          curl -fsSL -o index.html https://files.catbox.moe/xryqb4.html
          grep -q techTeamSelect js/app.js
          grep -q 'app.css?v=4' index.html
          grep -q tech-select css/app.css
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text()
          html = html.replace(r'\u0026', '&')
          Path('index.html').write_text(html)
          print('ok', 'techTeamSelect' in html)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/app.css js/app.js index.html
          git commit -m "Redesign phone control bar: technician dropdown, split density"
          git push
