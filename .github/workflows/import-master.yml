name: Ship Live card polish
on:
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download files
        run: |
          set -euo pipefail
          curl -fsSL -o js/app.js https://files.catbox.moe/h74ko1.js
          curl -fsSL -o css/app.css https://files.catbox.moe/whk0sw.css
          curl -fsSL -o index.html https://files.catbox.moe/wl9fhd.html
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text().replace(r'\\u0026', '&')
          Path('index.html').write_text(html)
          js = Path('js/app.js').read_text()
          css = Path('css/app.css').read_text()
          assert 'live-name' in js and 'compact-card' in js
          assert '-webkit-line-clamp: 2' in css
          assert 'app.js?v=4' in html
          print('ok')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js css/app.css index.html
          git commit -m "Polish Live cards: stronger name, heavier units, 2-line address"
          git push
