name: Ship density colours
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch density colours
        run: |
          python3 << 'PY'
          from pathlib import Path
          css = Path('css/app.css')
          text = css.read_text()
          old = '''.density-seg button.is-on,\n.density-seg button.be-on {\n  background: #0284c7;\n  color: #fff;\n  font-weight: 800;\n}'''
          new = '''#densityCompact.is-on,\n#densityCompact.be-on {\n  background: #059669;\n  color: #fff;\n  font-weight: 800;\n}\n#densityDetailed.is-on,\n#densityDetailed.be-on {\n  background: #7c3aed;\n  color: #fff;\n  font-weight: 800;\n}'''
          if old not in text:
              raise SystemExit('css pattern not found')
          css.write_text(text.replace(old, new, 1))
          html = Path('index.html')
          h = html.read_text()
          h2 = h.replace('css/app.css?v=7', 'css/app.css?v=8')
          if h2 == h:
              raise SystemExit('html cache bump not found')
          html.write_text(h2)
          print('patched')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add css/app.css index.html
          git diff --cached --quiet && echo no-changes && exit 0
          git commit -m "Colour Compact selected green and Detailed selected purple"
          git push
