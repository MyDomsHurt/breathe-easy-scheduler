name: Ship ACS badge parser fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download files
        run: |
          set -euo pipefail
          curl -fsSL -o js/app.js https://files.catbox.moe/0z8fva.js
          curl -fsSL -o index.html https://files.catbox.moe/8yyk4j.html
          grep -q liveAcsBadges js/app.js
          grep -q 'app.js?v=6' index.html
          python3 - << 'PY'
          t = open('js/app.js').read()
          assert 'liveAcsBadges' in t
          assert r'(?<!\d)(\d{1,2})' in t
          assert 'BEP|UC|S|W|B|C' in t
          print('ok')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/app.js index.html
          git diff --cached --quiet && echo no-changes && exit 0
          git commit -m "Badge only real ACS unit tokens on Live cards"
          git push
