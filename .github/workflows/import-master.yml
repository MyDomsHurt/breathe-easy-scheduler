name: Ship last-job van copy
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download files
        run: |
          set -euo pipefail
          curl -fsSL -o js/app.js https://files.catbox.moe/uqeq4x.js
          curl -fsSL -o index.html https://files.catbox.moe/jhuuqh.html
          grep -q 'back to the office' js/app.js
          grep -q 'app.js?v=8' index.html
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/app.js index.html
          git diff --cached --quiet && echo no-changes && exit 0
          git commit -m "Last-job van request copies back to the office"
          git push
