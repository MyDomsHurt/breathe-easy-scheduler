name: Ship Live card rebuild
on:
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download files
        run: |
          set -euo pipefail
          curl -fsSL -o js/app.js https://files.catbox.moe/9x892v.js
          curl -fsSL -o css/app.css https://files.catbox.moe/qwhldo.css
          curl -fsSL -o index.html https://files.catbox.moe/0aoosp.html
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text().replace(r'\\u0026', '&')
          Path('index.html').write_text(html)
          js = Path('js/app.js').read_text()
          assert 'live-name' in js and 'compact-card' in js
          assert 'app.js?v=3' in html and '>Live</button>' in html
          print('ok')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js css/app.css index.html
          git commit -m "Rebuild Live job cards: name, time+units, plain address, short notes"
          git push
