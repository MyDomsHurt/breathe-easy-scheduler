name: Ship van request pin button
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download files
        run: |
          set -euo pipefail
          curl -fsSL -o js/app.js https://files.catbox.moe/6x7gx6.js
          curl -fsSL -o css/app.css https://files.catbox.moe/uc4h82.css
          curl -fsSL -o index.html https://files.catbox.moe/hcr7wp.html
          grep -q copyVanPinBtn js/app.js
          grep -q getGpsPin js/app.js
          grep -q van-copy-row css/app.css
          grep -q 'app.js?v=10' index.html
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/app.js css/app.css index.html
          git diff --cached --quiet && echo no-changes && exit 0
          git commit -m "Add Copy van request + pin on the job modal"
          git push
