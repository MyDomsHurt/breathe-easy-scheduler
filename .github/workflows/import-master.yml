name: Ship Live ACS badges
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download files
        run: |
          set -euo pipefail
          curl -fsSL -o js/app.js https://files.catbox.moe/oo396p.js
          curl -fsSL -o css/app.css https://files.catbox.moe/yki3kx.css
          curl -fsSL -o index.html https://files.catbox.moe/5b6py3.html
          grep -q liveAcsBadges js/app.js
          grep -q live-u-s css/app.css
          grep -q 'app.css?v=9' index.html
          grep -q 'app.js?v=5' index.html
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/app.js css/app.css index.html
          git diff --cached --quiet && echo no-changes && exit 0
          git commit -m "Show Live ACS units as coloured count badges on the time row"
          git push
