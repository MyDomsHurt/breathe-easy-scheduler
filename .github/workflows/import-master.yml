name: Ship van request copy
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download files
        run: |
          set -euo pipefail
          curl -fsSL -o js/app.js https://files.catbox.moe/amumk0.js
          curl -fsSL -o css/app.css https://files.catbox.moe/66bq3h.css
          curl -fsSL -o index.html https://files.catbox.moe/v060sx.html
          grep -q vanRequestText js/app.js
          grep -q copyVanBtn js/app.js
          grep -q van-copy-btn css/app.css
          grep -q 'app.js?v=7' index.html
          grep -q 'app.css?v=10' index.html
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/app.js css/app.css index.html
          git diff --cached --quiet && echo no-changes && exit 0
          git commit -m "Add Copy van request on the job modal"
          git push
