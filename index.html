<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Breathe-Easy Scheduler</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          },
          fontFamily: {
            sans: ['Libre Franklin', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <style>
    body { font-family: 'Libre Franklin', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Auth gate -->
  <div id="authGate" class="fixed inset-0 z-[100] bg-slate-50 flex items-center justify-center p-4">
    <div class="text-center max-w-sm w-full">
      <div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-brand-800 text-white flex items-center justify-center text-xl font-bold shadow-lg">BE</div>
      <h1 class="text-xl font-semibold text-slate-800 mb-1">Breathe-Easy</h1>
      <p class="text-sm text-slate-500 mb-6">Sign in to view the schedule</p>
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
        <button id="googleSignIn" class="w-full flex items-center justify-center gap-3 px-4 py-2.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-medium text-sm transition">
          <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Sign in with Google
        </button>
        <p class="text-xs text-slate-400 mt-3">Only authorised Breathe-Easy accounts can access this schedule.</p>
      </div>
    </div>
  </div>

  <div id="app" class="hidden">
  <header class="bg-brand-800 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-white/20 flex items-center justify-center font-bold text-lg">BE</div>
        <div>
          <h1 class="font-semibold text-lg leading-tight">Breathe-Easy</h1>
          <p class="text-xs text-brand-100">2026 Scheduler</p>
        </div>
      </div>

      <div class="flex items-center gap-3 text-sm flex-wrap justify-end">
        <nav id="be-app-switch"
             class="flex rounded-lg overflow-hidden border-2 border-white/40 text-xs font-bold shadow-sm"
             aria-label="Switch app">
          <span class="px-3 py-1.5 bg-white text-brand-800">Schedule</span>
          <a href="dashboard/" class="px-3 py-1.5 bg-emerald-500 text-white hover:bg-emerald-400 transition">Performance</a>
        </nav>

        <div id="roleToggle"
             class="flex rounded-lg overflow-hidden border border-white/25 text-xs font-medium">
          <button id="roleOffice" class="role-btn px-3 py-1.5 bg-white text-brand-800">Office</button>
          <button id="roleTech" class="role-btn px-3 py-1.5 bg-white/10 text-white hover:bg-white/20">Technician</button>
        </div>

        <button id="compactToggle"
                type="button"
                class="shrink-0 px-2.5 py-1.5 rounded-lg text-xs font-semibold border border-white/30 bg-white/10 text-white hover:bg-white/20 active:scale-95 transition"
                title="Toggle compact view">Compact</button>

        <span id="jobCount" class="bg-white/15 px-2.5 py-1 rounded-full">— jobs</span>
        <span id="returnCount" class="bg-amber-500/90 text-white px-2.5 py-1 rounded-full hidden">0 returns</span>
        <span id="revenueTotal" class="bg-emerald-500/90 text-white px-2.5 py-1 rounded-full">$0</span>
        <span id="userChip" class="hidden bg-white/15 px-2.5 py-1 rounded-full text-xs max-w-[140px] truncate"></span>
        <button id="logoutBtn"
                class="text-xs bg-white/10 hover:bg-white/20 px-2.5 py-1 rounded-full">Sign out</button>
      </div>
    </div>
  </header>

  <!-- The rest of the original page body is required. This is still incomplete in this call. -->
  </div>
</body>
</html>
