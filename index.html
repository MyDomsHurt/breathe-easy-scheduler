<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Breathe-Easy Scheduler</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- ==================== LOGIN SCREEN ==================== -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
      <div class="text-center mb-8">
        <div class="inline-flex w-14 h-14 rounded-2xl bg-brand-800 text-white items-center justify-center font-bold text-xl mb-3">BE</div>
        <h1 class="text-xl font-semibold text-slate-800">Breathe-Easy</h1>
        <p class="text-sm text-slate-500 mt-1">Sign in to view the schedule</p>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
        <div id="loginError" class="hidden text-sm text-rose-600 bg-rose-50 border border-rose-200 rounded-lg px-3 py-2"></div>
        <button id="btnGoogle" type="button"
                class="w-full flex items-center justify-center gap-3 bg-white hover:bg-slate-50 border border-slate-300 text-slate-700 font-semibold rounded-lg py-3 text-sm transition shadow-sm">
          <svg class="w-5 h-5" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Sign in with Google
        </button>
        <p class="text-xs text-center text-slate-400">Only authorised Breathe-Easy accounts can access this schedule.</p>
      </div>
    </div>
  </div>

  <!-- ==================== APP (hidden until authenticated) ==================== -->
  <div id="appRoot" class="hidden">
  <!-- Header -->
  <header class="bg-brand-800 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-white/20 flex items-center justify-center font-bold text-lg">BE</div>
        <div>
          <h1 class="font-semibold text-lg leading-tight">Breathe-Easy</h1>
          <p class="text-xs text-brand-100">2026 Scheduler</p>
        </div>
      </div>
      <div class="flex items-center gap-3 text-sm flex-wrap justify-end">
        <div id="roleToggle" class="flex rounded-lg overflow-hidden border border-white/25 text-xs font-medium">
          <button id="roleOffice" class="role-btn px-3 py-1.5 bg-white text-brand-800">Office</button>
          <button id="roleTech" class="role-btn px-3 py-1.5 bg-white/10 text-white hover:bg-white/20">Technician</button>
        </div>
        <span id="jobCount" class="bg-white/15 px-2.5 py-1 rounded-full">— jobs</span>
        <span id="returnCount" class="bg-amber-500/90 text-white px-2.5 py-1 rounded-full hidden">0 returns</span>
        <span id="revenueTotal" class="bg-emerald-500/90 text-white px-2.5 py-1 rounded-full">$0</span>
        <span id="userChip" class="hidden bg-white/15 px-2.5 py-1 rounded-full text-xs max-w-[140px] truncate"></span>
        <button id="logoutBtn" class="text-xs bg-white/10 hover:bg-white/20 px-2.5 py-1 rounded-full">Sign out</button>
      </div>
    </div>
  </header>

  <!-- Technician quick date range (mobile-first) -->
  <div id="techRangeBar" class="bg-white border-b border-slate-200 sticky top-[57px] z-40 hidden">
    <div class="max-w-7xl mx-auto px-3 py-2">
      <div class="flex gap-2 items-center">
        <div class="flex gap-1.5 flex-1 overflow-x-auto no-scrollbar">
          <button data-range="today" class="range-btn shrink-0 flex-1 px-3 py-2 rounded-lg text-sm font-semibold bg-brand-600 text-white active:scale-95 transition">Today</button>
          <button data-range="this_week" class="range-btn shrink-0 flex-1 px-3 py-2 rounded-lg text-sm font-semibold bg-slate-100 text-slate-700 active:scale-95 transition">This Week</button>
          <button data-range="next_week" class="range-btn shrink-0 flex-1 px-3 py-2 rounded-lg text-sm font-semibold bg-slate-100 text-slate-700 active:scale-95 transition">Next Week</button>
        </div>
        <button id="compactToggle" type="button" class="shrink-0 px-2.5 py-2 rounded-lg text-xs font-semibold border border-slate-200 bg-white text-slate-600 active:scale-95 transition" title="Toggle compact view">
          Compact
        </button>
      </div>
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-4 py-5 grid grid-cols-1 lg:grid-cols-12 gap-5">
    <aside class="lg:col-span-3 space-y-4">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
        <h2 class="font-semibold text-sm text-slate-500 uppercase tracking-wide mb-3">Filters</h2>
        <label class="block text-xs font-medium text-slate-600 mb-1">Search</label>
        <input id="searchInput" type="search" placeholder="Client, mobile, address..." 
               class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none mb-3" />
        <label class="block text-xs font-medium text-slate-600 mb-1">Month</label>
        <div class="flex flex-wrap gap-1.5 mb-3" id="monthFilters">
          <button data-month="all" class="month-btn active px-3 py-1.5 rounded-lg text-sm font-medium bg-brand-600 text-white">All</button>
          <button data-month="1" class="month-btn px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-100 hover:bg-slate-200">Jan</button>
          <button data-month="2" class="month-btn px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-100 hover:bg-slate-200">Feb</button>
          <button data-month="3" class="month-btn px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-100 hover:bg-slate-200">Mar</button>
          <button data-month="4" class="month-btn px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-100 hover:bg-slate-200">Apr</button>
          <button data-month="5" class="month-btn px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-100 hover:bg-slate-200">May</button>
          <button data-month="6" class="month-btn px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-100 hover:bg-slate-200">Jun</button>
          <button data-month="7" class="month-btn px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-100 hover:bg-slate-200">Jul</button>
          <button data-month="8" class="month-btn px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-100 hover:bg-slate-200">Aug</button>
          <button data-month="9" class="month-btn px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-100 hover:bg-slate-200">Sep</button>
          <button data-month="10" class="month-btn px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-100 hover:bg-slate-200">Oct</button>
          <button data-month="11" class="month-btn px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-100 hover:bg-slate-200">Nov</button>
          <button data-month="12" class="month-btn px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-100 hover:bg-slate-200">Dec</button>
        </div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Team</label>
        <div class="flex flex-wrap gap-1.5 mb-3" id="teamFilters">
          <button data-team="all" class="team-btn active px-3 py-1.5 rounded-lg text-sm font-medium bg-brand-600 text-white">All</button>
        </div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Type</label>
        <div class="flex gap-1.5 mb-3">
          <button data-type="all" class="type-btn active px-3 py-1.5 rounded-lg text-sm font-medium bg-brand-600 text-white">All</button>
          <button data-type="clean" class="type-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-100 hover:bg-slate-200">Cleans</button>
          <button data-type="return" class="type-btn px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-100 hover:bg-slate-200">Returns</button>
        </div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Date</label>
        <select id="dateSelect" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 outline-none">
          <option value="all">All dates</option>
        </select>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
        <h2 class="font-semibold text-sm text-slate-500 uppercase tracking-wide mb-3">Snapshot</h2>
        <div id="statsPanel" class="space-y-2 text-sm"></div>
      </div>
      <div class="text-xs text-slate-400 px-1">
        Full year 2026 · Empty ACs = Return
      </div>
    </aside>
    <main class="lg:col-span-9">
      <div class="flex items-center justify-between mb-4">
        <h2 id="viewTitle" class="font-semibold text-lg">All Jobs</h2>
        <div class="flex gap-2">
          <button id="viewByDate" class="view-btn active px-3 py-1.5 rounded-lg text-sm bg-brand-600 text-white">By Date</button>
          <button id="viewByTeam" class="view-btn px-3 py-1.5 rounded-lg text-sm bg-slate-100 hover:bg-slate-200">By Team</button>
        </div>
      </div>
      <div id="jobsContainer" class="space-y-6"></div>
      <div id="emptyState" class="hidden text-center py-16 text-slate-400">
        <p class="text-lg">No jobs match the current filters</p>
      </div>
    </main>
  </div>
  <div id="modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/50" id="modalBackdrop"></div>
    <div class="absolute inset-x-4 top-10 bottom-10 md:inset-x-auto md:left-1/2 md:-translate-x-1/2 md:w-full md:max-w-lg bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col">
      <div class="bg-brand-800 text-white px-5 py-4 flex items-start justify-between">
        <div>
          <h3 id="modalTitle" class="font-semibold text-lg"></h3>
          <p id="modalSub" class="text-sm text-brand-100 mt-0.5"></p>
        </div>
        <button id="modalClose" class="text-white/80 hover:text-white text-2xl leading-none">&times;</button>
      </div>
      <div id="modalBody" class="p-5 overflow-y-auto flex-1 text-sm space-y-3"></div>
    </div>
  </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
